services:
  api:
    image: apifunkosconjunta
    build:
      context: .
      dockerfile: ApiFunkosConjunta/Dockerfile
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=funkos;Username=admin;Password=admin123"
      Cache__RedisConfiguration: "redis:6379"
      Cache__RedisInstanceName: "Funkos:"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - funkos-net

  postgres:
    image: postgres:17-alpine
    container_name: funkos-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: funkos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d funkos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - funkos-net

  redis:
    image: redis:7-alpine
    container_name: funkos-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - funkos-net

networks:
  funkos-net:
    driver: bridge

volumes:
  postgres-data:
    driver: local
